<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Anusha Portfolio</title>

    <style>
      /* ================= ROOT VARIABLES (LIGHT THEME) ================= */
      :root {
        --bg: #f5f7ff;
        --text: #222;
        --primary: #4a6cf7;
        --card: #ffffff;
      }

      /* ================= DARK MODE ================= */
      body.dark {
        --bg: #121212;
        --text: #ffffff;
        --primary: #6ea8fe;
        --card: #1e1e1e;
      }

      /* ================= GLOBAL ================= */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        transition: 0.3s;
      }

      /* ================= HEADER ================= */
      header {
        background: var(--primary);
        color: white;
        padding: 20px;
        text-align: center;
      }

      /* ================= NAV (FLEXBOX) ================= */
      nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 15px;
        background: #333;
        flex-wrap: wrap;
      }

      nav a {
        color: white;
        text-decoration: none;
      }

      /* ================= GRID LAYOUT ================= */
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 20px;
      }

      /* ================= CARD STYLE ================= */
      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* ================= FULL WIDTH SECTIONS ================= */
      .full {
        grid-column: 1 / -1;
      }

      /* ================= BUTTON ================= */
      button {
        padding: 10px 15px;
        background: var(--primary);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      /* ================= SKILLS FLEX ================= */
      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .skill {
        background: var(--primary);
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        nav {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Anusha Portfolio</h1>
      <button onclick="toggleDark()">Toggle Theme</button>
    </header>

    <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="container">
      <section id="about" class="card full">
        <h2>About Me</h2>
        <p>
          Hello! I am Anusha, a passionate web developer learning modern web
          technologies.
        </p>
      </section>

      <section id="skills" class="card">
        <h2>Skills</h2>
        <div class="skills">
          <span class="skill">HTML</span>
          <span class="skill">CSS</span>
          <span class="skill">JavaScript</span>
          <span class="skill">Git</span>
        </div>
      </section>

      <section id="projects" class="card">
        <h2>Projects</h2>
        <p>Portfolio Website</p>
        <p>To-Do App</p>
      </section>

      <section id="contact" class="card full">
        <h2>Contact</h2>
        <p>Email: dadianusha78@gmail.com</p>
      </section>
    </div>

    <script>
      function toggleDark() {
        document.body.classList.toggle("dark");
      }
    </script>
  </body>
</html>
